<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>傳統漢服元素與現代審美融合設計 - 創作評分系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f5f0;
      color: #2b2b2b;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    .border-cinnabar { border-color: #a83836; }
    .bg-cinnabar { background-color: #a83836; }
    .text-cinnabar { color: #a83836; }
    .bg-silk { background-color: #fdfbf7; }

    /* 針對 iPad 觸控調整輸入元件尺寸 */
    .touch-target {
      min-height: 44px;
    }

    @media print {
      .no-print { display: none !important; }
      body { background-color: #ffffff; color: #000000; }
      .print-page-break { page-break-inside: avoid; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 頂部導航列（支援電腦與平板適應） -->
  <header class="bg-silk border-b border-stone-200 sticky top-0 z-30 shadow-sm no-print">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <span class="w-2.5 h-6 bg-cinnabar rounded-sm inline-block"></span>
        <div>
          <h1 class="text-base sm:text-lg font-bold font-serif-tc text-stone-800 leading-tight">漢服現代融合設計 · 創作評分系統</h1>
          <p class="text-[11px] text-stone-500">視覺藝術科 · 8項全維度準則 (iPad / 電腦通用版)</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
        <label for="apiKeyInput" class="text-xs text-stone-600 font-medium shrink-0">Gemini Key：</label>
        <input type="password" id="apiKeyInput" placeholder="留空使用本地模擬評分" 
          class="border border-stone-300 rounded px-2.5 py-1 text-xs w-44 sm:w-56 focus:outline-none focus:ring-1 focus:ring-red-800 bg-white shadow-inner">
        <button id="toggleApiHelp" class="touch-target px-2 text-stone-400 hover:text-stone-600 text-sm">ⓘ</button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-6xl mx-auto px-4 py-4 sm:py-6 flex-grow w-full">

    <!-- 學生資訊列 -->
    <div class="bg-silk border border-stone-200 rounded-lg p-3 sm:p-4 mb-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-3 sm:gap-6 text-sm w-full sm:w-auto">
        <div class="flex items-center">
          <label class="text-stone-500 font-medium mr-1 text-xs sm:text-sm">學生：</label>
          <input type="text" id="studentName" value="學生姓名" class="border-b border-stone-300 bg-transparent px-1 py-0.5 focus:border-cinnabar focus:outline-none font-medium w-24">
        </div>
        <div class="flex items-center">
          <label class="text-stone-500 font-medium mr-1 text-xs sm:text-sm">班別：</label>
          <input type="text" id="studentClass" value="4A" class="border-b border-stone-300 bg-transparent px-1 py-0.5 focus:border-cinnabar focus:outline-none font-medium w-16">
        </div>
        <div class="text-xs sm:text-sm text-stone-600">
          <span class="text-stone-400">主題：</span>結合傳統漢服元素與現代審美
        </div>
      </div>
      <div class="no-print w-full sm:w-auto text-right">
        <button onclick="window.print()" class="touch-target w-full sm:w-auto text-xs bg-stone-100 active:bg-stone-200 border border-stone-300 text-stone-700 px-3 py-2 rounded transition flex items-center justify-center gap-1.5 font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          列印 / 匯出 PDF
        </button>
      </div>
    </div>

    <!-- 網格排版：在 iPad 直向或手機時為單欄，在 iPad 橫向或電腦為雙欄 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左欄：相片上傳/即時拍照 + 雷達圖概況 -->
      <div class="lg:col-span-5 space-y-4 sm:space-y-6">
        
        <div class="bg-silk border border-stone-200 rounded-lg p-4 sm:p-5 shadow-sm">
          <h2 class="text-sm sm:text-base font-bold font-serif-tc text-stone-800 mb-2 sm:mb-3 flex items-center">
            <span class="w-2 h-2 bg-cinnabar rounded-full mr-2"></span>作品圖片（拍照或上傳）
          </h2>
          
          <div id="dropZone" class="border-2 border-dashed border-stone-300 active:border-cinnabar transition-colors rounded-lg p-4 text-center cursor-pointer bg-white relative flex flex-col items-center justify-center min-h-[220px] sm:min-h-[280px]">
            <!-- 加上 capture 屬性，在 iPad 上點擊會自動彈出「拍照、照片圖庫、選擇檔案」選項 -->
            <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
            
            <div id="uploadPrompt" class="space-y-2 pointer-events-none">
              <div class="mx-auto w-12 h-12 bg-stone-100 rounded-full flex items-center justify-center text-stone-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </div>
              <p class="text-sm text-stone-700 font-medium">點擊拍照或選取照片</p>
              <p class="text-xs text-stone-400">iPad 支援相機即拍即評 · 電腦可拖曳檔案</p>
            </div>

            <div id="previewContainer" class="hidden w-full flex flex-col items-center">
              <img id="imagePreview" src="" alt="預覽作品" class="max-h-60 sm:max-h-72 w-auto object-contain rounded shadow-sm border border-stone-200">
              <p class="text-[11px] text-stone-400 mt-2">輕觸可重新拍照或更換圖片</p>
            </div>
          </div>

          <button id="evaluateBtn" disabled class="touch-target mt-3 w-full bg-cinnabar text-white py-2.5 rounded font-medium tracking-wide shadow transition active:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <span id="btnText">開始評估作品</span>
            <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          </button>
        </div>

        <!-- 評分概況與雷達分析 -->
        <div id="summaryCard" class="hidden bg-silk border border-stone-200 rounded-lg p-4 sm:p-5 shadow-sm print-page-break">
          <h2 class="text-sm sm:text-base font-bold font-serif-tc text-stone-800 mb-2 flex items-center justify-between">
            <span class="flex items-center"><span class="w-2 h-2 bg-cinnabar rounded-full mr-2"></span>能力維度分佈</span>
            <span class="text-xs font-normal text-stone-500">滿分 40 分</span>
          </h2>
          
          <div class="flex items-center justify-between bg-stone-50 p-3 rounded border border-stone-200 mb-3">
            <div>
              <p class="text-[11px] text-stone-500">總得分</p>
              <div class="flex items-baseline gap-1">
                <span id="totalScoreText" class="text-2xl sm:text-3xl font-black text-cinnabar">0</span>
                <span class="text-xs text-stone-400">/ 40</span>
              </div>
            </div>
            <div class="text-right">
              <p class="text-[11px] text-stone-500">評級結果</p>
              <span id="gradeLevelBadge" class="inline-block mt-0.5 px-2.5 py-0.5 bg-stone-200 text-stone-800 text-xs font-bold rounded-full">--</span>
            </div>
          </div>

          <div class="w-full h-56 sm:h-64">
            <canvas id="radarChart"></canvas>
          </div>
        </div>

      </div>

      <!-- 右欄：8項評審指標與改善意見 -->
      <div class="lg:col-span-7">
        
        <div class="bg-silk border border-stone-200 rounded-lg p-4 sm:p-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between border-b border-stone-200 pb-2.5 mb-3 gap-2">
            <div>
              <h2 class="text-base sm:text-lg font-bold font-serif-tc text-stone-800">各項評審指標與改善意見</h2>
              <p class="text-[11px] text-stone-500">共 8 項準則，每項 0-5 分</p>
            </div>
            <span class="text-[11px] px-2 py-0.5 bg-stone-100 border border-stone-200 text-stone-600 rounded">
              點擊可直接修改分數與文字
            </span>
          </div>

          <!-- 8項評分列表容器 -->
          <div id="criteriaList" class="space-y-3">
            <!-- 初始提示 -->
            <div id="emptyNotice" class="text-center py-12 text-stone-400">
              <svg class="mx-auto h-8 w-8 mb-1.5 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <p class="text-xs sm:text-sm">上傳或拍照後，系統將自動逐項評分並給予改善意見</p>
            </div>
          </div>

        </div>

      </div>

    </div>
  </main>

  <footer class="bg-stone-100 border-t border-stone-200 py-3 text-center text-[11px] text-stone-500 no-print mt-auto">
    漢服現代融合設計評分系統 · iPad / 電腦跨平台相容
  </footer>

  <script>
    const CRITERIA_DEFINITIONS = [
      { id: 1, category: "主題與元素融合", name: "傳統漢服形制與特徵呈現", guide: "交領右衽、對襟、襦裙、馬面裙等形制是否準確考究" },
      { id: 2, category: "主題與元素融合", name: "現代審美與時尚感結合", guide: "當代剪裁、比例搭配是否協調，具備現代潮流感與實穿性" },
      { id: 3, category: "文化轉化與功能設計", name: "文化符號與紋樣當代轉化", guide: "傳統幾何/植物紋樣與配飾的簡化、提煉與現代化重構" },
      { id: 4, category: "文化轉化與功能設計", name: "服裝結構邏輯與材質表現", guide: "穿著合理性，以及絲、麻、機能布等質感的筆觸表達" },
      { id: 5, category: "構圖與創意表現", name: "獨特創意與概念設計", guide: "破除刻板印象，構思的新穎度與個人原創風格" },
      { id: 6, category: "構圖與創意表現", name: "人物動態與版面構圖", guide: "人物姿態優雅度、比例掌握與畫面視覺焦點佈局" },
      { id: 7, category: "繪畫與技法", name: "線條清晰度與細節勾勒", guide: "線條流暢度、褶皺垂墜感及細節刻畫之嚴密性" },
      { id: 8, category: "繪畫與技法", name: "色彩漸變與立體光影", guide: "配色意境、明暗漸層、布料厚度與空間立體感塑造" }
    ];

    let currentImageData = null;
    let radarChartInstance = null;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const evaluateBtn = document.getElementById('evaluateBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const criteriaList = document.getElementById('criteriaList');
    const emptyNotice = document.getElementById('emptyNotice');
    const summaryCard = document.getElementById('summaryCard');
    const totalScoreText = document.getElementById('totalScoreText');
    const gradeLevelBadge = document.getElementById('gradeLevelBadge');

    // 拖曳處理（電腦端）
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-cinnabar', 'bg-red-50/20'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-cinnabar', 'bg-red-50/20'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cinnabar', 'bg-red-50/20');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    // 選擇檔案或拍照（iPad & 電腦通用）
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('請選取相片或拍照檔案！');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageData = e.target.result;
        imagePreview.src = currentImageData;
        uploadPrompt.classList.add('hidden');
        previewContainer.classList.remove('hidden');
        evaluateBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    // 點擊評分
    evaluateBtn.addEventListener('click', async () => {
      if (!currentImageData) return;
      const apiKey = apiKeyInput.value.trim();

      setLoading(true);
      try {
        let results;
        if (apiKey) {
          results = await evaluateWithGemini(apiKey, currentImageData);
        } else {
          await new Promise(r => setTimeout(r, 800));
          results = generateLocalMockEvaluation();
        }
        renderEvaluationResults(results);
      } catch (err) {
        console.error(err);
        alert(`評分發生錯誤：${err.message || '請確認 API Key 或網路狀態'}`);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      evaluateBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = "AI 正在分析作品各項細節...";
        btnSpinner.classList.remove('hidden');
      } else {
        btnText.textContent = "重新評估作品";
        btnSpinner.classList.add('hidden');
      }
    }

    async function evaluateWithGemini(apiKey, base64Image) {
      const pureBase64 = base64Image.split(',')[1];
      const mimeType = base64Image.split(';')[0].split(':')[1] || 'image/jpeg';

      const prompt = `
你是一位視覺藝術科評審。請針對學生的「傳統漢服元素與現代審美融合設計」畫作進行評審：
1. 傳統漢服形制與特徵呈現 (0-5)
2. 現代審美與時尚感結合 (0-5)
3. 文化符號與紋樣當代轉化 (0-5)
4. 服裝結構邏輯與材質表現 (0-5)
5. 獨特創意與概念設計 (0-5)
6. 人物動態與版面構圖 (0-5)
7. 線條清晰度與細節勾勒 (0-5)
8. 色彩漸變與立體光影 (0-5)

請直接輸出純 JSON，格式如下：
{
  "scores": [
    { "id": 1, "score": 4, "feedback": "具體改善意見..." },
    { "id": 2, "score": 3, "feedback": "具體改善意見..." },
    { "id": 3, "score": 4, "feedback": "具體改善意見..." },
    { "id": 4, "score": 3, "feedback": "具體改善意見..." },
    { "id": 5, "score": 4, "feedback": "具體改善意見..." },
    { "id": 6, "score": 4, "feedback": "具體改善意見..." },
    { "id": 7, "score": 3, "feedback": "具體改善意見..." },
    { "id": 8, "score": 4, "feedback": "具體改善意見..." }
  ]
}
`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: mimeType, data: pureBase64 } }
            ]
          }],
          generationConfig: {
            temperature: 0.2,
            response_mime_type: "application/json"
          }
        })
      });

      if (!response.ok) {
        const errJson = await response.json();
        throw new Error(errJson.error?.message || `請求失敗 (${response.status})`);
      }

      const resData = await response.json();
      return JSON.parse(resData.candidates[0].content.parts[0].text);
    }

    function generateLocalMockEvaluation() {
      return {
        scores: [
          { id: 1, score: 4, feedback: "漢服交領與襦裙的特徵明確，輪廓清晰，繫帶細節可再考究。" },
          { id: 2, score: 4, feedback: "現代寬肩西裝剪裁與傳統下裳結合流暢，展現出良好的當代時尚感。" },
          { id: 3, score: 3, feedback: "局部點綴了如意紋，建議紋樣排列可配合服裝走勢做幾何漸層變化。" },
          { id: 4, score: 3, feedback: "穿著邏輯合理，但布料軟硬質地（如棉麻與絲質）對比可再加強刻畫。" },
          { id: 5, score: 4, feedback: "構思新穎，成功擺脫傳統舞台戲服的既定印象，原創性高。" },
          { id: 6, score: 4, feedback: "人物體態流暢自然，服飾擺動感佳，版面主次分明。" },
          { id: 7, score: 3, feedback: "主體輪廓線順暢，建議加強褶皺邊界的整潔度，減少細碎重疊線。" },
          { id: 8, score: 4, feedback: "低飽和度的雅緻配色運用得當，暗部陰影若能再加深會更富厚度。" }
        ]
      };
    }

    function renderEvaluationResults(data) {
      if (emptyNotice) emptyNotice.remove();
      criteriaList.innerHTML = '';

      data.scores.forEach(item => {
        const def = CRITERIA_DEFINITIONS.find(d => d.id === item.id) || { category: "評核項目", name: `項目 ${item.id}`, guide: "" };
        
        const card = document.createElement('div');
        card.className = "bg-white border border-stone-200 rounded p-3 sm:p-4 shadow-sm print-page-break";
        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-1 mb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-bold text-stone-500 bg-stone-100 px-1.5 py-0.5 rounded">${def.category}</span>
              <span class="font-bold text-stone-800 text-xs sm:text-sm">${item.id}. ${def.name}</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-stone-400">得分：</span>
              <input type="number" min="0" max="5" value="${item.score}" data-id="${item.id}"
                class="score-input touch-target w-10 text-center font-bold text-cinnabar border border-stone-300 rounded py-1 text-sm focus:outline-none focus:ring-1 focus:ring-red-800">
              <span class="text-[11px] text-stone-400">/ 5</span>
            </div>
          </div>
          <p class="text-[11px] text-stone-400 mb-2 leading-tight">${def.guide}</p>
          <div class="bg-stone-50 rounded p-2 border border-stone-200">
            <label class="text-[10px] font-semibold text-stone-500 flex items-center mb-0.5">
              <span class="w-1.5 h-1.5 bg-cinnabar rounded-full mr-1"></span>改善意見與指導回饋：
            </label>
            <textarea class="feedback-input w-full bg-transparent text-xs text-stone-700 focus:outline-none resize-y border-0 p-0 leading-relaxed font-normal" rows="2">${item.feedback}</textarea>
          </div>
        `;
        criteriaList.appendChild(card);
      });

      document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('input', recalculateTotalAndChart);
      });

      summaryCard.classList.remove('hidden');
      recalculateTotalAndChart();
    }

    function recalculateTotalAndChart() {
      const inputs = document.querySelectorAll('.score-input');
      const scores = [];
      let total = 0;

      inputs.forEach(input => {
        let val = parseInt(input.value) || 0;
        if (val < 0) val = 0;
        if (val > 5) val = 5;
        input.value = val;
        scores.push(val);
        total += val;
      });

      totalScoreText.textContent = total;

      if (total >= 32) {
        gradeLevelBadge.textContent = "進階優異 (32-40分)";
        gradeLevelBadge.className = "inline-block mt-0.5 px-2.5 py-0.5 bg-red-100 text-cinnabar text-xs font-bold rounded-full";
      } else if (total >= 20) {
        gradeLevelBadge.textContent = "基礎達標 (20-31分)";
        gradeLevelBadge.className = "inline-block mt-0.5 px-2.5 py-0.5 bg-amber-100 text-amber-800 text-xs font-bold rounded-full";
      } else {
        gradeLevelBadge.textContent = "仍需努力 (0-19分)";
        gradeLevelBadge.className = "inline-block mt-0.5 px-2.5 py-0.5 bg-stone-200 text-stone-700 text-xs font-bold rounded-full";
      }

      updateRadarChart(scores);
    }

    function updateRadarChart(scoreValues) {
      const labels = CRITERIA_DEFINITIONS.map(d => `${d.id}.${d.name.substring(0, 3)}..`);
      const ctx = document.getElementById('radarChart').getContext('2d');

      if (radarChartInstance) {
        radarChartInstance.data.datasets[0].data = scoreValues;
        radarChartInstance.update();
        return;
      }

      radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: '獲得分數',
            data: scoreValues,
            backgroundColor: 'rgba(168, 56, 54, 0.2)',
            borderColor: '#a83836',
            borderWidth: 2,
            pointBackgroundColor: '#a83836',
            pointBorderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              min: 0,
              max: 5,
              ticks: { stepSize: 1, display: false },
              grid: { color: 'rgba(0, 0, 0, 0.06)' },
              angleLines: { color: 'rgba(0, 0, 0, 0.08)' },
              pointLabels: {
                font: { size: 10, family: "'Noto Sans TC', sans-serif" },
                color: '#555'
              }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    document.getElementById('toggleApiHelp').addEventListener('click', () => {
      alert("【iPad / 電腦使用說明】\n1. 在 iPad 上點擊上傳框，可選擇直接開啟「相機」拍攝學生實體畫紙。\n2. 留空 API Key 可直接體驗本地示範評分。\n3. 所有評分及回饋建議均可點擊直接修改。\n4. 點擊「列印 / 匯出 PDF」可將評分結果存檔或直接 AirPrint 列印。");
    });
  </script>
